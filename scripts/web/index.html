<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BT_Beacon</title>
<meta name="theme-color" content="#1a73e8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Beacon">
<link rel="manifest" id="manifestlink" href="manifest.webmanifest">
<link rel="apple-touch-icon" id="iconlink" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  html, body, #map { height: 100%; margin: 0; }
  .panel {
    position: absolute; z-index: 1000; background: rgba(255,255,255,.96);
    border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.3);
    font: 13px/1.45 system-ui, sans-serif;
  }
  /* ---- top HUD ---- */
  #hud { top: 10px; left: 50px; right: 10px; max-width: 340px; padding: 8px 12px; }
  #hudhead { display: flex; align-items: flex-start; gap: 4px; cursor: pointer;
             user-select: none; -webkit-user-select: none; }
  #hudhead > div { flex: 1; min-width: 0; }
  #hudhead b { font-size: 15px; }
  #hudtoggle { background: none; border: 0; font: inherit; color: #1a73e8;
               cursor: pointer; padding: 2px 0 0; width: 16px; line-height: 1;
               transition: transform .15s; }
  #hud:not(.collapsed) #hudtoggle { transform: rotate(90deg); }
  #hud.collapsed #hudbody { display: none; }
  #hudbody { margin-top: 6px; }
  #open { display:block; margin:6px 0 4px; padding:11px 12px; background:#1a73e8;
          color:#fff; text-align:center; text-decoration:none; border-radius:6px;
          font-weight:600; font-size:15px; }
  #open.off { background:#9aa0a6; pointer-events:none; }
  #hud a.alt { color:#1a73e8; text-decoration:none; font-size:12px; margin-right:12px; }
  #hud select { width: 100%; margin: 2px 0 4px; padding: 6px 8px; font: inherit;
                border: 1px solid #ccd; border-radius: 5px; background: #fff; }
  #hud small { color:#555; }

  /* ---- history ---- */
  #hist { bottom: 10px; left: 50px; width: min(330px, calc(100vw - 92px));
          max-height: 46vh; display: flex; flex-direction: column; overflow: hidden; }
  #hist.collapsed { max-height: none; }
  #hist.collapsed #list, #hist.collapsed #cal { display: none; }
  #histbar { display: flex; align-items: center; gap: 6px; padding: 8px 10px;
             cursor: pointer; user-select: none; -webkit-user-select: none; }
  #histtitle { font-size: 12px; text-transform: uppercase; letter-spacing: .04em;
               color: #555; flex: 1; white-space: nowrap; overflow: hidden;
               text-overflow: ellipsis; }
  #toggle, #calbtn, .calhead button, #allbtn {
    background: none; border: 0; font: inherit; color: #1a73e8; cursor: pointer;
    padding: 2px 4px; line-height: 1;
  }
  #toggle { width: 18px; text-align: center; transition: transform .15s; }
  #hist:not(.collapsed) #toggle { transform: rotate(90deg); }
  .chip { background: #e8f0fe; color: #1a73e8; border-radius: 10px;
          padding: 1px 8px; font-size: 11px; white-space: nowrap; }

  #cal { padding: 0 0 8px; border-bottom: 1px solid #eee; }
  .calhead { display: flex; align-items: center; justify-content: space-between;
             padding: 2px 8px 6px; }
  .calhead span { font-size: 12px; font-weight: 600; }
  .calgrid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px;
             padding: 0 8px; }
  .calgrid .dow { font-size: 10px; color: #999; text-align: center; padding-bottom: 2px; }
  .calgrid .day { text-align: center; padding: 5px 0; border-radius: 4px; font-size: 12px; }
  .calgrid .day.has { background: #e8f0fe; color: #1a73e8; cursor: pointer; font-weight: 600; }
  .calgrid .day.sel { background: #1a73e8; color: #fff; }
  .calgrid .day.off { color: #ccc; }
  #allbtn { display: block; margin: 6px 8px 0; font-size: 12px; }

  #list { overflow-y: auto; }
  .row { padding: 7px 10px; border-bottom: 1px solid #f2f2f2; cursor: pointer; }
  .row:hover { background: #f0f6ff; }
  .row.sel { background: #e8f0fe; box-shadow: inset 3px 0 0 #1a73e8; }
  .row .t { font-weight: 600; }
  .row .d { color: #666; font-size: 11px; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%;
         margin-right: 6px; vertical-align: middle; }
  .empty { padding: 10px; color: #888; font-size: 12px; }

  /* ---- timeline (desktop only) ---- */
  #timeline { display: none; }
  @media (min-width: 760px) {
    #timeline {
      display: block; bottom: 10px; left: 400px; right: 10px; max-width: 900px;
      padding: 6px 12px 8px;
    }
    #timeline[hidden] { display: none !important; }
  }
  #tlhead { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
  #tlwhen { font-weight: 600; white-space: nowrap; }
  #tlwhere { color: #555; font-size: 11px; overflow: hidden;
             text-overflow: ellipsis; white-space: nowrap; }
  #tlplay { background: none; border: 0; color: #1a73e8; cursor: pointer;
            font: inherit; padding: 0 2px; }
  #tlcanvas { display: block; width: 100%; height: 18px; margin: 3px 0 1px; }
  #tlrange { display: block; width: 100%; margin: 0; accent-color: #1a73e8; }

  #hint { display:none; bottom: 10px; right: 10px; max-width: 280px; padding: 12px; }
  #hint button { margin-top: 4px; padding: 6px 12px; }
  #banner { top: 10px; left: 50%; transform: translateX(-50%); width: min(92vw, 520px);
            padding: 8px 12px; background: #fff8e1; border: 1px solid #ffd54f;
            color: #5d4a00; font-size: 12px; z-index: 1200; }
  #banner code { background: #fff; padding: 1px 5px; border-radius: 3px; font-size: 11px; }
  .err { color: #b00; }
</style>
</head>
<body>
<div id="map"></div>

<div id="hud" class="panel">
  <div id="hudhead">
    <button id="hudtoggle" aria-label="Toggle details">&#9656;</button>
    <div>
      <b id="count">loading&hellip;</b>
      <span id="taglabel" class="chip" hidden></span>
      <br>
      <span id="seen"></span>
    </div>
  </div>
  <div id="hudbody">
    <select id="tagsel" hidden></select>
    <a id="open" class="off" href="#">Open latest in Google Maps</a>
    <a id="apple" class="alt" href="#">Apple Maps</a>
    <a id="copy" class="alt" href="#">Copy coordinates</a>
    <a id="install" class="alt" href="#">Add to Home Screen</a>
    <a id="adminlink" class="alt" href="#" hidden>Admin</a>
    <br><small id="meta"></small>
  </div>
</div>

<div id="banner" class="panel" hidden></div>

<div id="hist" class="panel collapsed">
  <div id="histbar">
    <button id="toggle" aria-label="Toggle history">&#9656;</button>
    <span id="histtitle">History</span>
    <span id="chip" class="chip" hidden></span>
    <button id="calbtn" aria-label="Pick a date">&#128197;</button>
  </div>
  <div id="cal" hidden>
    <div class="calhead">
      <button id="prev" aria-label="Previous month">&lsaquo;</button>
      <span id="monthlabel"></span>
      <button id="next" aria-label="Next month">&rsaquo;</button>
    </div>
    <div class="calgrid" id="calgrid"></div>
    <button id="allbtn">Recent</button>
  </div>
  <div id="list"></div>
</div>

<div id="timeline" class="panel" hidden>
  <div id="tlhead">
    <button id="tlplay" aria-label="Play through the day">&#9654;</button>
    <span id="tlwhen">&mdash;</span>
    <span id="tlwhere"></span>
  </div>
  <canvas id="tlcanvas"></canvas>
  <input id="tlrange" type="range" min="0" max="1000" step="1" value="1000"
         aria-label="Timeline">
</div>

<div id="hint" class="panel">
  <b>Add to Home Screen</b>
  <p id="hinttext" style="margin:8px 0 10px;"></p>
  <button id="hintclose">Got it</button>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map = L.map('map').setView([0, 0], 2);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19, attribution: '&copy; OpenStreetMap'
}).addTo(map);

// The dashboard can be mounted at a sub-path (e.g. https://host/track/), so
// every request must be relative to the page, never absolute.
const BASE = (() => {
  const p = location.pathname;
  return p.endsWith('/') ? p : p + '/';
})();

// Manifest/icon are relative too, resolved against the mount path.
document.getElementById('manifestlink').href = BASE + 'manifest.webmanifest';
document.getElementById('iconlink').href = BASE + 'apple-touch-icon.png';

async function getJson(path) {
  const r = await fetch(BASE + path, {cache: 'no-store'});
  const type = r.headers.get('content-type') || '';
  if (!r.ok || !type.includes('json')) {
    const body = (await r.text()).slice(0, 140).replace(/\s+/g, ' ');
    throw new Error(path + ' -> HTTP ' + r.status + ' (' + (type || 'no type') + '): ' + body);
  }
  return r.json();
}

const layer = L.layerGroup().addTo(map);

const state = {
  counts: {},       // local day -> points, from /api/summary
  selected: null,   // 'YYYY-MM-DD'
  reports: [],      // server-filtered window
  uiDays: 7,
  tag: '',          // '' = all accessible tags
  tagNames: {},     // tag_id -> name
  meta: {},
  firstLoad: true,
};

// stable colour per tag id, so a tag keeps its colour across reloads
const PALETTE = ['#1a73e8', '#e37400', '#188038', '#a142f4', '#d93025', '#007b83'];
function colorOf(id) { return PALETTE[Number(id) % PALETTE.length] || '#1a73e8'; }
function nameOf(id) { return state.tagNames[String(id)] || ''; }
let calMonth = new Date();
let markers = [];

const hist = document.getElementById('hist');
const hud = document.getElementById('hud');

/* ---------- helpers ---------- */
function dayKey(iso) {
  const d = new Date(iso);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') +
         '-' + String(d.getDate()).padStart(2, '0');
}
function rowTime(iso) {
  return new Date(iso).toLocaleTimeString([], {hour: '2-digit', minute: '2-digit', second: '2-digit'});
}
function rowDate(iso) {
  return new Date(iso).toLocaleDateString([], {month: 'short', day: 'numeric'});
}
function dayRange(key) {
  const parts = key.split('-').map(Number);
  const start = new Date(parts[0], parts[1] - 1, parts[2]);
  const end = new Date(parts[0], parts[1] - 1, parts[2] + 1);
  return {from: start.toISOString(), to: end.toISOString()};
}
function reportsPath() {
  if (state.selected) {
    const r = dayRange(state.selected);
    return 'api/reports?from=' + encodeURIComponent(r.from) + '&to=' + encodeURIComponent(r.to) +
           tagSuffix();
  }
  return 'api/reports?days=' + state.uiDays + tagSuffix();
}
function tagSuffix() {
  return state.tag ? '&tag=' + encodeURIComponent(state.tag) : '';
}

/* ---------- collapse (HUD + history) ---------- */
function persist(key, open) { try { localStorage.setItem(key, open ? '1' : '0'); } catch (e) {} }
function load(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }

function setHudCollapsed(v) { hud.classList.toggle('collapsed', v); persist('hudOpen', !v); }
function setHistCollapsed(v) { hist.classList.toggle('collapsed', v); persist('histOpen', !v); }

(function initFolds() {
  const small = window.innerWidth < 700;
  const h = load('hudOpen'), s = load('histOpen');
  setHudCollapsed(h === null ? small : h === '0');
  setHistCollapsed(s === null ? small : s === '0');
})();

document.getElementById('hudhead').addEventListener('click', () =>
  setHudCollapsed(!hud.classList.contains('collapsed')));
document.getElementById('histbar').addEventListener('click', (e) => {
  if (e.target.closest('button')) return;
  setHistCollapsed(!hist.classList.contains('collapsed'));
});
document.getElementById('toggle').addEventListener('click', () =>
  setHistCollapsed(!hist.classList.contains('collapsed')));

/* ---------- calendar ---------- */
const DOW = ['S', 'M', 'T', 'W', 'T', 'F', 'S'];
function renderCalendar() {
  const y = calMonth.getFullYear(), m = calMonth.getMonth();
  document.getElementById('monthlabel').textContent =
    calMonth.toLocaleDateString([], {month: 'long', year: 'numeric'});

  const grid = document.getElementById('calgrid');
  grid.innerHTML = '';
  DOW.forEach(d => {
    const el = document.createElement('div');
    el.className = 'dow';
    el.textContent = d;
    grid.appendChild(el);
  });

  const offset = new Date(y, m, 1).getDay();
  for (let i = 0; i < offset; i++) grid.appendChild(document.createElement('div'));

  const days = new Date(y, m + 1, 0).getDate();
  for (let d = 1; d <= days; d++) {
    const key = y + '-' + String(m + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');
    const n = state.counts[key] || 0;
    const el = document.createElement('div');
    el.className = 'day ' + (n ? 'has' : 'off') + (key === state.selected ? ' sel' : '');
    el.textContent = d;
    if (n) {
      el.title = n + ' point(s)';
      el.onclick = () => { state.selected = key; renderCalendar(); setHistCollapsed(false); refresh(); };
    }
    grid.appendChild(el);
  }
}
document.getElementById('prev').addEventListener('click', (e) => {
  e.stopPropagation();
  calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth() - 1, 1);
  renderCalendar();
});
document.getElementById('next').addEventListener('click', (e) => {
  e.stopPropagation();
  calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth() + 1, 1);
  renderCalendar();
});
document.getElementById('allbtn').addEventListener('click', (e) => {
  e.stopPropagation();
  state.selected = null;
  renderCalendar();
  refresh();
});
document.getElementById('calbtn').addEventListener('click', (e) => {
  e.stopPropagation();
  const cal = document.getElementById('cal');
  cal.hidden = !cal.hidden;
  if (!cal.hidden) { setHistCollapsed(false); renderCalendar(); }
});

/* ---------- render ---------- */
function render() {
  const visible = state.reports;

  layer.clearLayers();
  markers = [];
  visible.forEach((x, i) => {
    const newest = i === visible.length - 1;
    const color = colorOf(x.tag_id);
    const m = L.circleMarker([x.lat, x.lon], {
      radius: newest ? 10 : 5,
      color: color,
      weight: newest ? 3 : 2,
      fillOpacity: newest ? 0.9 : 0.45
    }).bindPopup(
      `<b>${nameOf(x.tag_id) || 'tag'} &middot; ${new Date(x.when).toLocaleString()}</b><br>` +
      `accuracy ${x.accuracy} m<br>${x.lat.toFixed(6)}, ${x.lon.toFixed(6)}`
    ).addTo(layer);
    markers.push(m);
  });

  // one line per tag - a single line would zigzag between devices
  const byTag = {};
  visible.forEach(p => (byTag[p.tag_id] = byTag[p.tag_id] || []).push([p.lat, p.lon]));
  Object.entries(byTag).forEach(([id, pts]) => {
    if (pts.length > 1) {
      L.polyline(pts, {color: colorOf(id), weight: 2, opacity: .5}).addTo(layer);
    }
  });
  if (visible.length && state.firstLoad) {
    map.fitBounds(visible.map(p => [p.lat, p.lon]), {padding: [40, 40]});
    state.firstLoad = false;
  }

  const list = document.getElementById('list');
  list.innerHTML = '';
  if (!visible.length) {
    const el = document.createElement('div');
    el.className = 'empty';
    el.textContent = state.selected ? 'no points on this date' : 'no reports in this window';
    list.appendChild(el);
  }
  for (let i = visible.length - 1; i >= 0; i--) {
    const x = visible[i];
    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = `<span class="dot" style="background:${colorOf(x.tag_id)}"></span>` +
                    `<span class="t">${rowTime(x.when)}</span> ` +
                    `<span class="d">${nameOf(x.tag_id)} &middot; ${rowDate(x.when)} &middot; ${x.accuracy} m</span>`;
    row.dataset.i = i;
    row.onclick = () => {
      tlJump(i);
      map.setView([x.lat, x.lon], 17);
      markers[i] && markers[i].openPopup();
    };
    list.appendChild(row);
  }

  const chip = document.getElementById('chip');
  if (state.selected) {
    chip.hidden = false;
    chip.textContent = state.selected + '  \u00d7';
    chip.onclick = (e) => { e.stopPropagation(); state.selected = null; renderCalendar(); refresh(); };
  } else {
    chip.hidden = true;
  }
  document.getElementById('histtitle').textContent = 'History \u00b7 ' + visible.length;

  const last = visible.length ? visible[visible.length - 1] : null;
  document.getElementById('count').textContent =
    visible.length + ' report(s)' + (state.selected ? '' : ' \u00b7 last ' + state.uiDays + 'd');
  document.getElementById('seen').textContent =
    last ? 'last seen ' + new Date(last.when).toLocaleString() : 'nothing in this range';

  const open = document.getElementById('open');
  if (last) {
    const q = last.lat.toFixed(6) + ',' + last.lon.toFixed(6);
    open.href = 'https://www.google.com/maps/search/?api=1&query=' + q;
    open.classList.remove('off');
    document.getElementById('apple').href = 'https://maps.apple.com/?ll=' + q + '&q=Beacon';
    document.getElementById('copy').onclick = () =>
      navigator.clipboard && navigator.clipboard.writeText(q);
  } else {
    open.classList.add('off');
  }

  tlBuild();
}

/* ---------- timeline (desktop) ---------- */
// A scrubber over the loaded window: dragging shows which report was the latest
// one at that moment (marker + label + row highlight), so you can replay a day
// and see where the tag was at any time.
const tl = {
  t0: 0, t1: 0, active: -1, cursor: null, timer: null, playing: false,
  follow: true, at: null,
};

function tlTime(x) { return new Date(x.when).getTime(); }

// last report at or before t (binary search; reports are sorted ascending)
function tlIndexAt(t) {
  const rs = state.reports;
  if (!rs.length) return -1;
  if (t == null || isNaN(t)) return rs.length - 1;
  let lo = 0, hi = rs.length - 1, best = 0;
  while (lo <= hi) {
    const mid = (lo + hi) >> 1;
    if (tlTime(rs[mid]) <= t) { best = mid; lo = mid + 1; }
    else hi = mid - 1;
  }
  return best;
}

function tlDraw() {
  const c = document.getElementById('tlcanvas');
  const rs = state.reports;
  const w = c.clientWidth, h = c.clientHeight;
  if (!w || !h) return;
  const dpr = window.devicePixelRatio || 1;
  if (c.width !== Math.round(w * dpr) || c.height !== Math.round(h * dpr)) {
    c.width = Math.round(w * dpr);
    c.height = Math.round(h * dpr);
  }
  const g = c.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, w, h);

  g.fillStyle = '#eceff1';
  g.fillRect(0, h / 2 - 1, w, 2);
  if (!rs.length || tl.t1 <= tl.t0) return;

  const span = tl.t1 - tl.t0;
  const xOf = t => ((t - tl.t0) / span) * (w - 2) + 1;

  rs.forEach(x => {
    g.fillStyle = colorOf(x.tag_id);
    g.fillRect(xOf(tlTime(x)), 3, 1.5, h - 6);
  });

  if (tl.active >= 0 && rs[tl.active]) {
    g.fillStyle = '#d93025';
    g.fillRect(xOf(tlTime(rs[tl.active])) - 0.5, 0, 1.5, h);
  }
}

function tlSetActive(i, pan) {
  const rs = state.reports;
  if (!rs.length) return;
  i = Math.max(0, Math.min(rs.length - 1, i));
  tl.active = i;
  const x = rs[i];

  if (!tl.cursor) {
    tl.cursor = L.circleMarker([x.lat, x.lon], {
      radius: 12, color: '#d93025', weight: 2, fill: false, opacity: .9
    }).addTo(map);
  } else {
    tl.cursor.setLatLng([x.lat, x.lon]);
  }
  tl.cursor.bringToFront();

  document.getElementById('tlwhen').textContent = new Date(x.when).toLocaleString();
  document.getElementById('tlwhere').textContent =
    (nameOf(x.tag_id) || 'tag') + ' \u00b7 ' + x.lat.toFixed(5) + ', ' +
    x.lon.toFixed(5) + ' \u00b7 \u00b1' + x.accuracy + ' m';

  document.querySelectorAll('#list .row.sel').forEach(r => r.classList.remove('sel'));
  const row = document.querySelector('#list .row[data-i="' + i + '"]');
  if (row) row.classList.add('sel');

  document.getElementById('tlrange').value =
    tl.t1 > tl.t0 ? Math.round(((tlTime(x) - tl.t0) / (tl.t1 - tl.t0)) * 1000) : 1000;

  tlDraw();
  if (pan && !map.getBounds().contains(L.latLng(x.lat, x.lon))) {
    map.panTo([x.lat, x.lon], {animate: false});
  }
}

function tlBuild() {
  const panel = document.getElementById('timeline');
  const rs = state.reports;
  if (!rs.length) {
    panel.hidden = true;
    if (tl.cursor) { tl.cursor.remove(); tl.cursor = null; }
    tl.active = -1;
    return;
  }
  panel.hidden = false;
  tl.t0 = tlTime(rs[0]);
  tl.t1 = tlTime(rs[rs.length - 1]);
  if (tl.t1 <= tl.t0) tl.t1 = tl.t0 + 60000;
  tlSetActive(tl.follow ? rs.length - 1 : tlIndexAt(tl.at));
}

function tlJump(i) {
  tl.follow = false;
  tl.at = tlTime(state.reports[Math.min(i, state.reports.length - 1)]);
  tlSetActive(i, true);
}

function tlStopPlay() {
  if (tl.timer) { clearInterval(tl.timer); tl.timer = null; }
  tl.playing = false;
  document.getElementById('tlplay').textContent = '\u25b6';
}

document.getElementById('tlrange').addEventListener('input', (e) => {
  tlStopPlay();
  const rs = state.reports;
  if (!rs.length) return;
  tl.follow = false;
  tl.at = tl.t0 + (Number(e.target.value) / 1000) * (tl.t1 - tl.t0);
  const raw = e.target.value;              // keep the thumb where the user put it
  tlSetActive(tlIndexAt(tl.at));
  e.target.value = raw;
});

document.getElementById('tlrange').addEventListener('change', (e) => {
  const rs = state.reports;
  if (Number(e.target.value) >= 995) tl.follow = true;
  if (tl.active >= 0) map.panTo([rs[tl.active].lat, rs[tl.active].lon]);
});

document.getElementById('tlplay').addEventListener('click', () => {
  if (tl.playing) { tlStopPlay(); return; }
  if (!state.reports.length) return;
  tl.playing = true;
  tl.follow = false;
  document.getElementById('tlplay').textContent = '\u23f8';
  const step = Math.max(1, Math.round(state.reports.length / 200));
  tl.timer = setInterval(() => {
    const next = tl.active + step;
    if (next >= state.reports.length) { tlSetActive(state.reports.length - 1, true); tlStopPlay(); return; }
    tlSetActive(next, true);
  }, 150);
});

window.addEventListener('resize', tlDraw);

/* ---------- tag selector ---------- */
function renderTagSelect(tags) {
  const sel = document.getElementById('tagsel');
  const label = document.getElementById('taglabel');

  if (!tags.length) {
    sel.hidden = true;
    label.hidden = true;
    state.tag = '';
    return;
  }

  if (tags.length === 1) {
    // one tag: no switching, but make it obvious which tag is on screen
    state.tag = String(tags[0].id);
    sel.hidden = true;
    label.hidden = false;
    label.textContent = tags[0].name;
    return;
  }

  sel.hidden = false;
  sel.disabled = false;
  const known = tags.some(t => String(t.id) === String(state.tag));
  if (!known) state.tag = '';
  sel.innerHTML = '<option value="">all tags</option>' +
    tags.map(t => `<option value="${t.id}">${t.name} (${t.points})</option>`).join('');
  sel.value = state.tag;

  label.hidden = false;
  const current = tags.find(t => String(t.id) === String(state.tag));
  label.textContent = current ? current.name : 'all tags';
}
document.getElementById('tagsel').addEventListener('change', (e) => {
  state.tag = e.target.value;
  state.selected = null;
  refresh();
});

/* ---------- data ---------- */
function setBanner(err, lastOk) {
  const b = document.getElementById('banner');
  if (!err) { b.hidden = true; return; }
  const ago = lastOk ? new Date(lastOk).toLocaleString() : 'never';
  b.innerHTML = '<b>Background fetch failed</b><br>' + err +
    '<br><small>last success: ' + ago +
    '. If this is an Apple session problem, renew it on the server:<br>' +
    '<code>bash deploy.sh login</code></small>';
  b.hidden = false;
}

async function refresh() {
  try {
    const tz = new Date().getTimezoneOffset();

    let sum = null;
    let apiError = null;
    try {
      sum = await getJson('api/summary?tz=' + tz + tagSuffix());
    } catch (e) {
      apiError = e.message;   // older server without /api/summary
    }

    const rep = await getJson(reportsPath());

    if (!sum) {
      const days = {};
      (rep.reports || []).forEach(p => {
        const k = dayKey(p.when);
        days[k] = (days[k] || 0) + 1;
      });
      sum = {count: (rep.reports || []).length, days: days, ui_days: 0,
             keep_days: 0, max_points: 0, stored_since: null,
             error: null, last_ok: rep.last_ok};
      state.uiDays = 0;
    }

    if (sum.error && !sum.count) throw new Error(sum.error);

    state.counts = sum.days || {};
    state.uiDays = sum.ui_days === undefined ? state.uiDays : sum.ui_days;
    state.meta = sum;
    state.reports = rep.reports || [];
    state.tagNames = {};
    (sum.tags || []).forEach(t => { state.tagNames[String(t.id)] = t.name; });

    renderTagSelect(sum.tags || []);
    const adminLink = document.getElementById('adminlink');
    adminLink.href = BASE + 'admin';
    adminLink.hidden = !sum.admin;

    setBanner(apiError || sum.error, sum.last_ok);

    document.getElementById('meta').textContent =
      (sum.stored_since ? 'since ' + new Date(sum.stored_since).toLocaleDateString() : '') +
      (sum.keep_days ? ' \u00b7 keep ' + sum.keep_days + 'd' : ' \u00b7 keep all') +
      (sum.max_points ? '/' + sum.max_points : '') +
      ' \u00b7 updated ' + new Date().toLocaleTimeString();

    if (state.firstLoad) {
      const keys = Object.keys(state.counts).sort();
      if (keys.length) {
        const p = keys[keys.length - 1].split('-').map(Number);
        calMonth = new Date(p[0], p[1] - 1, 1);
      }
    }

    render();
    if (!document.getElementById('cal').hidden) renderCalendar();
  } catch (e) {
    document.getElementById('count').innerHTML = '<span class="err">' + e.message + '</span>';
  }
}

/* ---------- install ---------- */
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredPrompt = e; });
const installBtn = document.getElementById('install');
if (window.matchMedia('(display-mode: standalone)').matches || navigator.standalone) {
  installBtn.style.display = 'none';
}
installBtn.onclick = async (e) => {
  e.preventDefault();
  if (deferredPrompt) { deferredPrompt.prompt(); deferredPrompt = null; return; }
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
  document.getElementById('hinttext').textContent = ios
    ? 'In Safari tap the Share button (square with an arrow), then "Add to Home Screen". The icon opens this page and fetches the latest fix.'
    : 'Open the browser menu and choose "Install app" or "Add to Home screen".';
  document.getElementById('hint').style.display = 'block';
};
document.getElementById('hintclose').onclick = () =>
  document.getElementById('hint').style.display = 'none';

refresh();
setInterval(refresh, 30000);
</script>
