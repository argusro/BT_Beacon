<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BT_Beacon admin</title>
<style>
  :root { color-scheme: light; }
  body { font: 14px/1.5 system-ui, sans-serif; margin: 0; padding: 20px;
         background: #f6f7f9; color: #111; }
  h1 { font-size: 20px; margin: 0 0 18px; }
  h2 { font-size: 15px; margin: 26px 0 8px; }
  a { color: #1a73e8; }
  .card { background: #fff; border-radius: 8px; padding: 14px 16px;
          box-shadow: 0 1px 3px rgba(0,0,0,.12); max-width: 860px; }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid #eee;
           vertical-align: middle; }
  th { font-size: 12px; text-transform: uppercase; letter-spacing: .04em;
       color: #666; }
  input[type=text], input[type=password] { padding: 7px 9px; border: 1px solid #ccd;
       border-radius: 5px; font: inherit; width: 160px; }
  button { font: inherit; padding: 7px 12px; border-radius: 5px; border: 0;
           background: #1a73e8; color: #fff; cursor: pointer; }
  button.ghost { background: #e8eaed; color: #333; }
  button.danger { background: #d93025; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .muted { color: #777; font-size: 12px; }
  .tag { display: inline-block; margin: 1px 4px 1px 0; }
  .err { color: #d93025; }
  #msg { margin-top: 10px; min-height: 18px; font-size: 13px; }
</style>
</head>
<body>
<h1>BT_Beacon &middot; admin</h1>
<p class="muted"><a href="./">&#8592; map</a> &middot;
  tags come from <code>keys/&lt;name&gt;_keys.json</code> on the server.</p>

<div class="card">
  <h2>Tags</h2>
  <table id="tags"><thead>
    <tr><th>Tag</th><th>Points</th><th>Last seen</th></tr>
  </thead><tbody></tbody></table>
</div>

<div class="card" style="margin-top:16px">
  <h2>Users</h2>
  <table id="users"><thead>
    <tr><th>User</th><th>Admin</th><th>Tags</th><th></th></tr>
  </thead><tbody></tbody></table>

  <h2 style="margin-top:20px">Create / update user</h2>
  <div class="row">
    <input id="nu" type="text" placeholder="username" autocomplete="off">
    <input id="np" type="password" placeholder="password" autocomplete="new-password">
    <label><input id="na" type="checkbox"> admin</label>
    <button id="save">Save</button>
  </div>
  <div class="muted">Leaving the password blank on an existing user keeps it.</div>
  <div id="msg"></div>
</div>

<script>
const $ = (id) => document.getElementById(id);
let users = [], tags = [];

function say(text, bad) {
  $('msg').textContent = text || '';
  $('msg').className = bad ? 'err' : 'muted';
}

async function api(path, opts) {
  const r = await fetch(path, opts || {cache: 'no-store'});
  const type = r.headers.get('content-type') || '';
  if (!type.includes('json')) {
    const body = (await r.text()).slice(0, 120).replace(/\s+/g, ' ');
    throw new Error(path + ' -> HTTP ' + r.status + ': ' + body);
  }
  const data = await r.json();
  if (!r.ok) throw new Error(data.error || ('HTTP ' + r.status));
  return data;
}

function renderTags() {
  const tb = $('tags').querySelector('tbody');
  tb.innerHTML = '';
  tags.forEach(t => {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${t.name}</td><td>${t.points}</td>` +
                   `<td>${t.last_seen ? new Date(t.last_seen).toLocaleString() : '-'}</td>`;
    tb.appendChild(tr);
  });
  if (!tags.length) tb.innerHTML = '<tr><td colspan="3" class="muted">no tags</td></tr>';
}

function renderUsers() {
  const tb = $('users').querySelector('tbody');
  tb.innerHTML = '';
  users.forEach(u => {
    const tr = document.createElement('tr');
    const boxes = tags.map(t => {
      const on = u.tag_ids.includes(t.id);
      return `<label class="tag"><input type="checkbox" data-u="${u.id}" data-t="${t.id}"` +
             `${on ? ' checked' : ''}${u.is_admin ? ' disabled' : ''}> ${t.name}</label>`;
    }).join(' ');

    tr.innerHTML = `<td>${u.username}</td><td>${u.is_admin ? 'yes' : ''}</td>` +
                   `<td>${u.is_admin ? '<span class="muted">all</span>' : boxes}</td>`;
    const cell = document.createElement('td');
    const del = document.createElement('button');
    del.className = 'ghost';
    del.textContent = 'delete';
    del.onclick = async () => {
      if (!confirm('Delete user ' + u.username + '?')) return;
      try {
        const d = await api('api/admin/user/delete', {
          method: 'POST', headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({id: u.id})
        });
        users = d.users; renderUsers(); say('deleted');
      } catch (e) { say(e.message, true); }
    };
    cell.appendChild(del);
    tr.appendChild(cell);
    tb.appendChild(tr);
  });
  tb.querySelectorAll('input[type=checkbox][data-u]').forEach(cb => {
    cb.onchange = async () => {
      try {
        const d = await api('api/admin/access', {
          method: 'POST', headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({user_id: +cb.dataset.u, tag_id: +cb.dataset.t,
                                grant: cb.checked})
        });
        users = d.users; say('saved');
      } catch (e) { say(e.message, true); }
    };
  });
}

async function load() {
  try {
    const d = await api('api/admin/overview');
    users = d.users; tags = d.tags;
    renderTags(); renderUsers();
  } catch (e) { say(e.message, true); }
}

$('save').onclick = async () => {
  const username = $('nu').value.trim();
  if (!username) { say('username required', true); return; }
  try {
    const d = await api('api/admin/user', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({username, password: $('np').value,
                            is_admin: $('na').checked})
    });
    users = d.users;
    $('nu').value = ''; $('np').value = ''; $('na').checked = false;
    renderUsers(); say('saved');
  } catch (e) { say(e.message, true); }
};

load();
</script>
</body>
</html>
