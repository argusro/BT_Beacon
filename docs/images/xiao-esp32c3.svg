<svg xmlns="http://www.w3.org/2000/svg" width="900" height="660" viewBox="0 0 900 660" role="img" aria-labelledby="t">
  <title id="t">Seeed XIAO ESP32-C3 board, top view with pin labels</title>
  <defs>
    <linearGradient id="pcb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#333845"/>
      <stop offset="1" stop-color="#23262f"/>
    </linearGradient>
    <linearGradient id="can" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d7dbe1"/>
      <stop offset="0.55" stop-color="#aeb4bd"/>
      <stop offset="1" stop-color="#9298a1"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6c778"/>
      <stop offset="1" stop-color="#c39a3c"/>
    </linearGradient>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M10,0 L0,5 L10,10 z" fill="#8b949e"/>
    </marker>
  </defs>

  <rect width="900" height="660" fill="#ffffff"/>

  <text x="40" y="50" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#24292f">XIAO ESP32-C3 — top view</text>
  <text x="40" y="78" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#57606a">21 × 17.5 mm · 7 pads per side, 2.54 mm pitch · illustration, not a photograph</text>

  <!-- board -->
  <rect x="250" y="120" width="420" height="350" rx="14" fill="url(#pcb)" stroke="#12151b" stroke-width="2"/>

  <!-- USB-C -->
  <text x="460" y="94" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#57606a">USB-C</text>
  <rect x="400" y="100" width="120" height="34" rx="8" fill="#cfd3d9" stroke="#8b9199"/>
  <rect x="416" y="108" width="88" height="14" rx="4" fill="#6b7280"/>

  <!-- U.FL -->
  <text x="612" y="128" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#57606a">U.FL</text>
  <circle cx="612" cy="175" r="28" fill="#cfd3d9" stroke="#8b9199" stroke-width="2"/>
  <circle cx="612" cy="175" r="21" fill="none" stroke="#9aa0a8" stroke-width="2"/>
  <circle cx="612" cy="175" r="7" fill="#8b9199"/>

  <!-- shield can -->
  <rect x="330" y="200" width="214" height="150" rx="6" fill="url(#can)" stroke="#7c838c"/>
  <text x="437" y="282" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#3b4149">ESP32-C3</text>

  <!-- buttons -->
  <rect x="360" y="405" width="80" height="38" rx="5" fill="#3f4756" stroke="#6b7280"/>
  <text x="400" y="429" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9" fill="#e5e7eb">BOOT</text>
  <rect x="470" y="405" width="80" height="38" rx="5" fill="#3f4756" stroke="#6b7280"/>
  <text x="510" y="429" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9" fill="#e5e7eb">RESET</text>

  <!-- pads: left column -->
  <g fill="url(#gold)" stroke="#8d6b1f" stroke-width="0.8">
    <rect x="236" y="152" width="18" height="26" rx="3" fill="#e8912d" stroke="#b2601a"/>
    <rect x="236" y="194" width="18" height="26" rx="3"/>
    <rect x="236" y="236" width="18" height="26" rx="3"/>
    <rect x="236" y="278" width="18" height="26" rx="3"/>
    <rect x="236" y="320" width="18" height="26" rx="3"/>
    <rect x="236" y="362" width="18" height="26" rx="3"/>
    <rect x="236" y="404" width="18" height="26" rx="3"/>
    <rect x="666" y="152" width="18" height="26" rx="3"/>
    <rect x="666" y="194" width="18" height="26" rx="3"/>
    <rect x="666" y="236" width="18" height="26" rx="3"/>
    <rect x="666" y="278" width="18" height="26" rx="3"/>
    <rect x="666" y="320" width="18" height="26" rx="3"/>
    <rect x="666" y="362" width="18" height="26" rx="3"/>
    <rect x="666" y="404" width="18" height="26" rx="3"/>
  </g>

  <!-- pin labels -->
  <g font-family="Consolas, monospace" font-size="12" fill="#334155">
    <text x="226" y="170" text-anchor="end" fill="#c2681a" font-weight="700">5V</text>
    <text x="226" y="212" text-anchor="end">GND</text>
    <text x="226" y="254" text-anchor="end">3V3</text>
    <text x="226" y="296" text-anchor="end">D10</text>
    <text x="226" y="338" text-anchor="end">D9</text>
    <text x="226" y="380" text-anchor="end">D8</text>
    <text x="226" y="422" text-anchor="end">D7</text>
    <text x="694" y="170">D6</text>
    <text x="694" y="212">D5</text>
    <text x="694" y="254">D4</text>
    <text x="694" y="296">D3</text>
    <text x="694" y="338">D2</text>
    <text x="694" y="380">D1</text>
    <text x="694" y="422">D0</text>
  </g>

  <!-- dimension: 21 mm -->
  <line x1="250" y1="520" x2="670" y2="520" stroke="#8b949e" stroke-width="1" marker-start="url(#b)" marker-end="url(#a)"/>
  <line x1="250" y1="506" x2="250" y2="534" stroke="#8b949e"/>
  <line x1="670" y1="506" x2="670" y2="534" stroke="#8b949e"/>
  <rect x="421" y="508" width="78" height="24" fill="#ffffff"/>
  <text x="460" y="525" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#57606a">21 mm</text>

  <!-- dimension: 17.5 mm -->
  <line x1="726" y1="120" x2="726" y2="470" stroke="#8b949e" stroke-width="1" marker-start="url(#b)" marker-end="url(#a)"/>
  <line x1="712" y1="120" x2="740" y2="120" stroke="#8b949e"/>
  <line x1="712" y1="470" x2="740" y2="470" stroke="#8b949e"/>
  <text x="742" y="295" transform="rotate(-90 742 295)" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#57606a">17.5 mm</text>

  <text x="40" y="600" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#57606a">The orange pad is 5V — that is VBUS, so feed it through a Schottky (see the power path above) or use a data-only USB cable.</text>
  <text x="40" y="622" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#57606a">D4 / D5 are the default I²C pins, D6 / D7 the default UART pins on this variant.</text>
</svg>
