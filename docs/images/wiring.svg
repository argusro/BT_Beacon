<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img" aria-labelledby="t">
  <title id="t">Power path: 12 V car supply through an MP1584 buck and a Schottky diode into the XIAO 5V pin</title>
  <rect width="1000" height="430" fill="#ffffff"/>

  <text x="40" y="44" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#24292f">Power path — 12 V to the XIAO <tspan font-family="Consolas, monospace">5V</tspan> pin</text>
  <text x="40" y="72" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#57606a">MP1584 set to 5.0 V · Schottky on the output · fuse on the input</text>

  <!-- rails -->
  <line x1="190" y1="200" x2="250" y2="200" stroke="#57606a" stroke-width="2"/>
  <line x1="326" y1="200" x2="370" y2="200" stroke="#57606a" stroke-width="2"/>
  <line x1="570" y1="200" x2="640" y2="200" stroke="#57606a" stroke-width="2"/>
  <line x1="672" y1="200" x2="720" y2="200" stroke="#57606a" stroke-width="2"/>
  <line x1="115" y1="280" x2="115" y2="330" stroke="#57606a" stroke-width="2"/>
  <line x1="115" y1="330" x2="720" y2="330" stroke="#57606a" stroke-width="2"/>
  <line x1="470" y1="310" x2="470" y2="330" stroke="#57606a" stroke-width="2"/>

  <!-- 12 V source -->
  <rect x="40" y="170" width="150" height="110" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="115" y="212" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#24292f">12 V</text>
  <text x="115" y="232" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#57606a">car / PSU</text>
  <text x="115" y="250" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#57606a">ignition-switched</text>

  <!-- fuse -->
  <text x="288" y="178" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#57606a">0.5–1 A fuse</text>
  <rect x="250" y="186" width="76" height="28" rx="6" fill="#ffffff" stroke="#57606a" stroke-width="1.5"/>
  <text x="288" y="205" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#24292f">fuse</text>

  <!-- buck -->
  <rect x="370" y="140" width="200" height="170" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="470" y="168" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#24292f">MP1584</text>
  <text x="470" y="186" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#57606a">buck converter</text>
  <text x="470" y="214" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#24292f">IN+   IN−</text>
  <text x="470" y="248" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#0969da">OUT 5.0 V</text>
  <text x="470" y="270" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#57606a">trim it before wiring the board</text>

  <!-- diode -->
  <polygon points="640,184 672,200 640,216" fill="#24292f"/>
  <line x1="672" y1="181" x2="672" y2="219" stroke="#24292f" stroke-width="3"/>
  <text x="656" y="172" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#57606a">SS34</text>

  <!-- XIAO -->
  <rect x="720" y="120" width="240" height="230" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="840" y="150" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#24292f">XIAO ESP32-C3</text>
  <text x="742" y="204" font-family="Consolas, monospace" font-size="12" fill="#24292f">5V</text>
  <text x="766" y="204" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#57606a">(VBUS)</text>
  <text x="742" y="334" font-family="Consolas, monospace" font-size="12" fill="#24292f">GND</text>
  <text x="840" y="238" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#57606a">no diode on the board:</text>
  <text x="840" y="252" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#57606a">the Schottky is not optional</text>

  <!-- notes -->
  <text x="40" y="390" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#57606a">With USB plugged in, a data-only cable (no VBUS) lets you keep the serial console without two supplies fighting.</text>
  <text x="40" y="410" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#57606a">Optional: SMBJ18A TVS across the 12 V input. Keep the U.FL antenna away from metal and near glass in a car.</text>
</svg>
