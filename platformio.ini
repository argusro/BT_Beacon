; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:seeed_xiao_esp32c3]
platform = espressif32
board = seeed_xiao_esp32c3
framework = arduino

; Resolves to platformio espressif32 6.9.0 + Arduino core 3.0.0 (IDF 5.1).
; That core has no Bluedroid "BLE" library: Bluetooth is NimBLE only
; (CONFIG_BT_NIMBLE_ENABLED=1 in the prebuilt libs). The firmware therefore
; talks to the NimBLE host API directly -- no external BLE library needed.
;
; XIAO ESP32-C3 exposes its native USB Serial/JTAG as COM9.
; (The board definition already sets ARDUINO_USB_MODE=1 and
;  ARDUINO_USB_CDC_ON_BOOT=1, so Serial goes to this port.)
upload_port = COM9
monitor_port = COM9
monitor_speed = 115200
monitor_filters = direct

; Which key ring this firmware advertises. scripts/prebuild_keys.py creates
; keys/<tag>_keys.json on first use and renders src/beacon_keys.h from it;
; re-flashing the same tag reuses the ring (no identity rotation).
; Flash another device with:  $env:BEACON_TAG="tag2"; pio run -t upload
custom_tag = beacon
extra_scripts = scripts/prebuild_keys.py
